<!-- Lab 5: Design a webpage using <p> tag and <h1> tag and make font color red, background color yellow and font family “time new roman” for all element using universal selector. -->
<html>

<head>
    <title>Universal Selector</title>

    <style>
        * {
            color: red;
            background-color: yellow;
            font-family: "Times New Roman", Times, serif;
        }
    </style>
</head>

<body>
    <h1>
        Universal Selector
    </h1>
    <p>
        This is an example of universal selector.
    </p>
</body>

</html>
