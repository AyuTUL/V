<!-- Lab 17: Write a java script program to take size of array, value from user and display the value. -->
<html>

<head>
    <title>Display Array</title>

    <script>
        function createArray() {
            let size = document.getElementById("size").value;
            let arr = [];

            for (let i = 0; i < size; i++)
                arr[i] = prompt("Enter value for element " + (i + 1) + " :");

            document.getElementById("result").innerHTML = "Array: [" + arr.join(", ") + "]";
        }

    </script>
</head>

<body>
        Enter array size :
        <input type="number" id="size">
        <button type="button" onclick="createArray()">Create Array</button>

        <div id="result"></div>
</body>

</html>
