<!-- Lab 15: Write a java script code that ask user to take two string and checks them of equality. If both strings are equal then display the first string in uppercase else print two string are not equal. -->
<html>

<head>
    <title>String Equality</title>

    <script>
        let str1=prompt("Enter first string :");
        let str2=prompt("Enter second string :");
        if(str1===str2){
            document.write("Both strings are equal.<br>");
            document.write("First string in uppercase : " + str1.toUpperCase());
        }
        else
            document.write("Two strings are not equal.");
    </script>
</head>

</html>
