<!-- Lab 7: Write a java script program to demonstrate mouse event. You can use button, division, paragraph etc. -->
<html>

<head>
    <title>Mouse Events</title>
    <style>
        #box {
            width: 200px;
            height: 200px;
            border: 2px solid black;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>

</head>

<body>

    <div id="box">Interact to view mouse events</div>
    <p id="log">Event: None</p>

    <script>
        const box = document.getElementById("box");
        const log = document.getElementById("log");

        function showEvent(event) {
            log.textContent = "Event : " + event.type;
        }
        box.addEventListener("click", showEvent);
        box.addEventListener("dblclick", showEvent);
        box.addEventListener("mousedown", showEvent);
        box.addEventListener("mouseup", showEvent);
        box.addEventListener("mousemove", showEvent);
        box.addEventListener("mouseover", showEvent);
        box.addEventListener("mouseout", showEvent);
        box.addEventListener("mouseenter", showEvent);
        box.addEventListener("mouseleave", showEvent);
    </script>

</body>

</html>
