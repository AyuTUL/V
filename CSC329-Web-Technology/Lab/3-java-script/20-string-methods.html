<!-- Lab 20: For the string “web programming is amazing and exciting to learn”. Find out length of string, reverse a string, search a word “exciting”, remove extra white space if present, convert the string into array and display, find the character present on position 8, extract the part of the string from position 2 to 10, replace the word programming with technology. -->
<html>

<head>
	<title>String Methods</title>
</head>

<body>
	<script>
		let text = "web programming is amazing and exciting to learn";
		document.write("Original String: " + text + "<br><br>");
		document.write("Length: " + text.length + "<br>");
		document.write("Reverse: " + text.split("").reverse().join("") + "<br>");
		if(text.includes("exciting"))
			document.write("Search 'exciting': " + text.indexOf("exciting") + "<br>");
		else
			document.write("Search 'exciting': Not found<br>");
		document.write("Remove extra space: " + text.trim() + "<br>");
		document.write("Array: [" + text.split(" ").join(", ") + "]<br>");
		document.write("Char at position 8: " + text.charAt(8) + "<br>");
		document.write("Substring (2 to 10): " + text.substring(2, 10) + "<br>");
		document.write("Replace 'programming': " + text.replace("programming", "technology") + "<br>");
	</script>
</body>

</html>
