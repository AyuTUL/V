<!-- Lab 21: Use your own creativity and design a webpage using HTML sectioning elements. -->
<html>

<head>
    <title>Japan</title>

    <link href="https://fonts.cdnfonts.com/css/simplifica" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0
        }

        body {
            height: 100vh;
            font-family: simplifica;
            color: #fff;
            background:
                linear-gradient(rgba(0, 0, 0, .5), rgba(0, 0, 0, .4)),
                url(Resource/21-hanamura.jpg) center/cover no-repeat;
        }

        nav {
            width: 90%;
            margin: auto;
            padding: 35px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav img {
            width: 80px
        }

        nav li {
            display: inline-block;
            margin: 0 15px;
            position: relative;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            font-size: 35px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        nav li::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -8px;
            height: 3px;
            width: 100%;
            background: #ff56b6;
        }

        main {
            position: absolute;
            top: 50%;
            width: 100%;
            text-align: center;
            transform: translateY(-50%);
        }

        h1 {
            font-family: Tsushima3;
            font-size: 112px;
            letter-spacing: 10px;
            font-weight: normal;
        }

        p {
            font-size: 40px;
            letter-spacing: 3px;
            margin: 20px 0 40px;
        }

        a {
            text-decoration: none;
        }

        button {
            width: 200px;
            padding: 15px 0;
            margin: 0 10px;
            font-size: 25px;
            letter-spacing: 3px;
            border-radius: 25px;
            border: 2px solid #ff56b6;
            background: transparent;
            color: #fff;
            font-family: inherit;
        }

        footer {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            font-size: 15px;
            letter-spacing: 2px;
        }
    </style>
</head>

<body>

    <header>
        <nav>
            <img src="Resource/21-logo.png" alt="Logo">
            <ul>
                <li><a href="#">About Japan</a></li>
                <li><a href="#">History</a></li>
                <li><a href="#">Japanese Cuisine</a></li>
                <li><a href="#">Wildlife</a></li>
                <li><a href="#">Gallery</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <article>
                <h1>JAPAN</h1>
                <p>Japan. Endless Discovery.</p>
            </article>
            <aside>
                <a href="#"><button>Learn More</button></a>
                <a href="#"><button>Images</button></a>
            </aside>
        </section>
    </main>

    <footer>&copy; 2026 Japan Tourism. All rights reserved.</footer>

</body>

</html>
