<!-- Q A.1: Write a Java Script code to check whether the entered number form HTML page is armstrong or not. Create a function named check with argument passing. -->
<html>

<head>
    <title>Armstrong Number Checker</title>

    <script>
        function check(number) {
            let value = parseInt(number);

            if (isNaN(value) || value < 0) {
                document.getElementById("result").innerHTML = "Please enter a valid positive number.";
                return;
            }

            let temp = value;
            let digitCount = temp.toString().length;
            let sum = 0;

            while (temp > 0) {
                let digit = temp % 10;
                sum += Math.pow(digit, digitCount);
                temp = parseInt(temp / 10);
            }

            if (value === 0)
                sum = 0;

            if (sum === value)
                document.getElementById("result").innerHTML = value + " is an Armstrong number.";
            else
                document.getElementById("result").innerHTML = value + " is not an Armstrong number.";
        }
    </script>
</head>

<body>
    <input type="number" id="number" placeholder="Enter a number">
    <button onclick="check(document.getElementById('number').value)">Check</button>

    <p id="result"></p>
</body>

</html>
