<!-- Q B.3: Write a jQuery for fadein and fadeout the image of eurocup logo slowly upon clicking same fade button. -->
<html>

<head>
    <title>Fade In Fade Out Image</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script>
        $(function () {
            $("#fade").click(function () {
                if ($("#logo").is(":visible")) {
                    $("#logo").fadeOut("slow");
                    $(this).text("Fade In");
                } else {
                    $("#logo").fadeIn("slow");
                    $(this).text("Fade Out");
                }
            });
        });
    </script>
</head>

<body>
    <button id="fade">Fade Out</button>
    <br><br>
    <img id="logo" src="euro-logo.jpg" alt="Euro Cup Logo" height="220">
</body>

</html>
