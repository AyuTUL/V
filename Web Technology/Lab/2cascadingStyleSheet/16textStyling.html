<!-- Lab 16: Give an example using text styling. (Use color, letter-spacing, word-spacing, text-align, text decoration, text-transform and text-shadow property). -->
<html>

<head>
    <title>Text Styling</title>

    <style>
        h2 {
            color: hotpink;
            letter-spacing: 5px;
            word-spacing: 10px;
            text-align: left;
            text-decoration: overline;
            text-transform: lowercase;
            text-shadow: 1px 2px 3px cyan;
        }
    </style>
</head>

<body>
    <h2>Text Styling</h2>

</body>

</html>
