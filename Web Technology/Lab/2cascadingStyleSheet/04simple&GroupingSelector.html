<!-- Lab 4: Give an example of simple selector and grouping selector. -->
<html>

<head>
    <title>Simple & Grouping Selector</title>

    <style>
        .font {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        p {
            text-align: center;
        }

        #padding {
            padding: 20px;
        }

        h1,
        p {
            text-decoration: line-through;
        }
    </style>
</head>

<body>
    <h1 class="font">
        Simple & Grouping Selector
    </h1>
    <p class="font" id="padding">
        This is an example of simple & grouping selector.
    </p>
</body>

</html>
