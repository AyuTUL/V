<!-- Lab 9: Design a webpage using combinator selector. Give proper example using:
        a.	Descendant selector
        b.	Child selector
        c.	Adjacent sibling selector
        d.	General sibling selector -->
<html>

<head>
    <title>Combinator Selector</title>

    <style>
        div p {
            color: blue;
            text-decoration: underline;
        }

        div>p {
            text-align: center;
        }

        h2+p {
            color: red;
        }

        h2~p {
            font-style: italic;
        }
    </style>

</head>

<body>

    <h1>Combinator Selector</h1>

    <div>
        <p>Descendant selector example (inside div)</p>
        <p>Child selector example (direct child of div)</p>
    </div>

    <h2>Heading 2</h2>
    <p>Adjacent sibling selector example (right after h2)</p>
    <p>General sibling selector example (any p after h2)</p>

</body>

</html>
