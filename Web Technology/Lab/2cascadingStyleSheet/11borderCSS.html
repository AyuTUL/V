<!-- Lab 11: Design a webpage using border-style, border-color and border-width like below: -->
<html>

<head>
    <title>Border Property</title>

    <style>
        p{
            border-width: 3px;
        }
        #dotted {
            border-style: dotted;
            border-color: violet;
        }

        #dashed {
            border-style: dashed;
            border-color: indigo;
        }

        #solid {
            border-style: solid;
            border-color: blue;
        }

        #double {
            border-style: double;
            border-color: green;
        }

        #groove {
            border-style: groove;
            border-color: yellow;
        }

        #ridge {
            border-style: ridge;
            border-color: orange;
        }

        #inset {
            border-style: inset;
            border-color: red;
        }

        #outset {
            border-style: outset;
            border-color: turquoise;
        }

        #no {
            border-style: none;
        }

        #hidden {
            border-style: hidden;
            border-color: cyan;
        }

        #mixed {
            border-style: dotted dashed solid double;
            border-color: hotpink;
        }
    </style>
</head>

<body>
    <h1>The border-style Property</h1>
    This property specifies what kind of border to display:
    <p id="dotted">A dotted border.</p>
    <p id="dashed">A dashed border.</p>
    <p id="solid">A solid border.</p>
    <p id="double">A double border.</p>
    <p id="groove">A groove border.</p>
    <p id="ridge">A ridge border.</p>
    <p id="inset">An inset border.</p>
    <p id="outset">An outset border.</p>
    <p id="no">No border.</p>
    <p id="hidden">A hidden border.</p>
    <p id="mixed">A mixed border.</p>
</body>

</html>
