<!-- Lab 13: Design a webpage using border-radius property like below: -->
<html>

<head>
    <title>Border-radius Property</title>

    <style>
        #normal {
            border: 3px solid blue;
            border-radius: 0;
            padding: 3px;
        }

        #round {
            border: 3px solid red;
            border-radius: 5px;
            padding: 3px;
        }

        #rounder {
            border: 3px solid green;
            border-radius: 10px;
            padding: 3px;
        }

        #roundest {
            border: 3px solid silver;
            border-radius: 15px;
            padding: 3px;   
        }
    </style>
</head>

<body>
    <p id="normal">Normal border</p>
    <p id="round">Round border</p>
    <p id="rounder">Rounder border</p>
    <p id="roundest">Roundest border</p>
</body>

</html>
