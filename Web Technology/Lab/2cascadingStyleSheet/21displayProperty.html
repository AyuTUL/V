<!-- Lab 21: Display a horizontal list of link using CSS display property. -->
<html>

<head>
    <title>Display Property</title>

    <style>
        li {
            display: inline;
        }
    </style>
</head>

<body>
    Display a list of links as a horizontal menu:
    <ul>
        <li><a href="#">HTML</a></li>
        <li><a href="#">CSS</a></li>
        <li><a href="#">JavaScript</a></li>
</body>

</html>
