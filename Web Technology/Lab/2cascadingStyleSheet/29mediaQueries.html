<!-- Lab 29: Give an example using media queries. -->
<!DOCTYPE html>
<html>

<head>
    <title>Media Query</title>

    <style>
        body {
            background-color: hotpink;
            text-align: center;
        }

        @media (max-width: 900px) {
            body {
                background-color: cyan;
            }
        }

        @media (max-width: 600px) {
            body {
                background-color: orange;
            }
        }
    </style>
</head>

<body>

    <h1>Media Query</h1>
    <p>Background color changes with screen size.</p>

</body>

</html>
