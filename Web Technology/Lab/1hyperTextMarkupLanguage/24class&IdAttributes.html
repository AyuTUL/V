<!-- Lab 24: Design a webpage using <div> tag using class and id attribute. -->
<html>

<head>
    <title>Div Tag & Class, Id Attributes</title>

    <style>
        .container {
            display: flex;
            gap: 10px;
            font-family: 'Playfair Display', Georgia, 'Times New Roman', Times, serif;
        }

        .box {
            border: 5px solid black;
            margin: 5px;
            padding: 15px;
            flex: 1;
        }

        #header,
        #quiz-select {
            text-align: center;
        }

        p {
            font-size: 15px;
        }

        label {
            display: inline-block;
            min-width: 100px;
            margin: 5px;
        }
    </style>
</head>

<body>

    <div id="header">
        <h1>Quiz</h1>
    </div>

    <div class="container">

        <div class="box" id="details">
            <h2>1: Personal Details</h2>
            <p>
                <label>Name :</label>
                <input type="text"><br>
                <label>Age :</label>
                <input type="text"><br>
                <label>Address :</label>
                <input type="text">
            </p>
            <button>Save Details</button>
        </div>

        <div class="box" id="quiz-select">
            <h2>2: One Punch Man</h2>
            <p>Who is the <strong>Hero Hunter</strong>?</p>
            <select required>
                <option>---Select Answer</option>
                <option>Garou</option>
                <option>Caped Baldy</option>
                <option>Fubuki</option>
                <option>Silver Fang</option>
            </select>
            <br><br>
            <button>Submit Answer</button>
        </div>

        <div class="box" id="quiz">
            <h2>3: Frieren – Beyond Journey's End</h2>
            <p>What does <strong>Himmel</strong> mean in German?</p>
            <input type="radio" name="ans"> Himal<br>
            <input type="radio" name="ans"> Him<br>
            <input type="radio" name="ans"> Heaven<br>
            <input type="radio" name="ans"> Human<br><br>
            <button>Submit Answer</button>
        </div>

    </div>

</body>

</html>
