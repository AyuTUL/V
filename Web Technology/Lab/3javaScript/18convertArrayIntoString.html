<!-- Lab 18: Write java script code to create an array that hold the name of 10 students. Convert the array into string and print that array. -->
<html>

<head>
    <title>Array of Students</title>

    <script>
        let students = ["abhilekh", "alisha", "anshu", "anush", "ashlesha", "ayush", "ayush", "barsha", "diya", "gaurav"];
        let studentString = students.join("-");

        document.write("Array of Students :<br>" + students + "<br><br>");
        document.write("Array to String :<br>" + studentString);
    </script>
</head>

</html>
