<!-- Lab 1: Write a java script program to demonstrate variable like var, let and const with different datatypes. -->
<html>

<head>
    <title>Variables</title>

    <script>
        var name = "Heung-Min Son";
        _jersey = 7;
        document.write("var name = " + name + "<br>" + "_jersey = " + _jersey + "<br>");

        var name = "Cristiano Ronaldo";
        _jersey = 9;
        document.write("redeclared var name = " + name + "<br>" + "reassigned _jersey = " + _jersey + "<br><br>");


        let firstName = "Richarlison";
        let isGoat = true;
        document.write("let firstName = " + firstName + "<br>" + "Is GOAT? " + isGoat + "<br>");

        firstName = "Benjamin";
        document.write("reassigned let firstName = " + firstName + "<br><br>");

        const lastName = "Fernandes";
        const mistakes = null;
        const role = undefined;
        document.write("const lastName = " + lastName + "<br>" + "Mistakes = " + mistakes + "<br>" + "Role = " + role);
    </script>
</head>

</html>
