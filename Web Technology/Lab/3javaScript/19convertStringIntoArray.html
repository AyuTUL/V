<!-- Lab 19: Write a java script code to create an string which contain name of 5 students separated with comma. Convert the string into array and display the result.  -->
<html>

<head>
    <title>String into Array</title>

    <script>
        let studentString="yurisha,prasanna,suave,kritam,jigme";
        let students=studentString.split(",");
        document.write("String of Students :<br>" + studentString + "<br><br>");
        document.write("String to Array :<br>" + students);
    </script>
</head>

</html>
