<!-- Lab 22: Create an array of size 10, add some element on it of your choice. Now add any three element at last, remove one element from last, add 3 new element from first position, add 5 new element from position 6 onward, delete any 2 elements from position 2 to 4. Convert final array into string and display the result. -->
<html>

<head>
    <title>Array Operations</title>
    <script>
        let arr = [];

        function show(id) {
            document.getElementById(id).style.display = "block";
        }

        function display(id) {
            document.getElementById(id).innerHTML = "Array: [" + arr.join(", ") + "]";
        }

        function readBase() {
            arr = [];
            for (let i = 0; i < 10; i++)
                arr[i] = document.getElementById("index" + i).value;
            display("original");
            show("original");
            show("pushSection");
        }

        function doPush() {
            arr.push(
                document.getElementById("push0").value,
                document.getElementById("push1").value,
                document.getElementById("push2").value
            );
            display("push");
            show("popSection");
        }

        function doPop() {
            arr.pop();
            display("pop");
            show("unshiftSection");
        }

        function doUnshift() {
            arr.unshift(
                document.getElementById("unshift0").value,
                document.getElementById("unshift1").value,
                document.getElementById("unshift2").value
            );
            display("unshift");
            show("spliceSection");
        }

        function doSpliceAdd() {
            arr.splice(5, 0,
                document.getElementById("splice0").value,
                document.getElementById("splice1").value,
                document.getElementById("splice2").value,
                document.getElementById("splice3").value,
                document.getElementById("splice4").value
            );
            display("splice");
            show("deleteSection");
        }

        function doDelete() {
            arr.splice(1, 2);
            display("slice");
            document.getElementById("result").innerHTML = "String: " + arr.toString();
        }
    </script>
</head>

<body>
    <h3>Enter 10 array elements</h3>
    <div>
        <script>
            for (let i = 0; i < 10; i++)
                document.write("Value " + i + ": <input type='text' id='index" + i + "'><br>");
        </script>
        <button type="button" onclick="readBase()">Confirm</button>
        <p id="original" style="display: none;"></p>
    </div>

    <div id="pushSection" style="display: none;">
        <h3>Add 3 elements at last</h3>
        <input type="text" id="push0"><br>
        <input type="text" id="push1"><br>
        <input type="text" id="push2"><br>
        <button type="button" onclick="doPush()">Confirm</button>
        <p id="push"></p>
    </div>

    <div id="popSection" style="display: none;">
        <h3>Remove 1 element from last</h3>
        <button type="button" onclick="doPop()">Confirm</button>
        <p id="pop"></p>
    </div>

    <div id="unshiftSection" style="display: none;">
        <h3>Add 3 elements at first</h3>
        <input type="text" id="unshift0"><br>
        <input type="text" id="unshift1"><br>
        <input type="text" id="unshift2"><br>
        <button type="button" onclick="doUnshift()">Confirm</button>
        <p id="unshift"></p>
    </div>

    <div id="spliceSection" style="display: none;">
        <h3>Add 5 elements at position 6</h3>
        <input type="text" id="splice0"><br>
        <input type="text" id="splice1"><br>
        <input type="text" id="splice2"><br>
        <input type="text" id="splice3"><br>
        <input type="text" id="splice4"><br>
        <button type="button" onclick="doSpliceAdd()">Confirm</button>
        <p id="splice"></p>
    </div>

    <div id="deleteSection" style="display: none;">
        <h3>Delete 2 elements from position 2</h3>
        <button type="button" onclick="doDelete()">Confirm</button>
        <p id="slice"></p>
        <p id="result"></p>
    </div>
</body>

</html>
