<!-- Lab 10: Design a webpage using background image with additional CSS properties like background-repeat, background-position, background-size. -->
<html>

<head>
    <title>Background CSS</title>

    <style>
        body {
            background-image: url('Resource/10doomfist.png');
            background-repeat: repeat;
            background-position: center;
            background-size: auto;
            color: white;
        }
    </style>

</head>

<body>
    <h1>Background Image</h1>
    <p>This webpage demonstrates background-image with CSS properties.</p>
</body>

</html>
