<!-- Lab 6: Design a webpage using attribute selector. Give proper example using:
        a.	CSS [attribute] Selector
        b.	CSS [attribute="value"] Selector
        c.	CSS [attribute~="value"] Selector
        d.	CSS [attribute|="value"] Selector
        e.	CSS [attribute^="value"] Selector
        f.	CSS [attribute$="value"] Selector
        g.	CSS [attribute*="value"] Selector -->
<html>

<head>
    <title>Attribute Selector</title>

    <style>
        p[class] {
            text-decoration: underline;
        }

        p[class="exact"] {
            text-decoration: overline;
        }

        p[class~="word"] {
            text-decoration: line-through;
        }

        p[lang|="en"] {
            text-decoration: underline overline;
        }

        p[class^="start"] {
            text-decoration: underline;
        }

        p[class$="end"] {
            text-decoration: overline;
        }

        p[class*="mid"] {
            text-decoration: line-through;
        }
    </style>

</head>

<body>

    <h1>Attribute Selector</h1>

    <p class="test">CSS [attribute] Selector</p>
    <p class="exact">CSS [attribute="value"] Selector</p>
    <p class="my word class">CSS [attribute~="value"] Selector</p>
    <p lang="en-US">CSS [attribute|="value"] Selector</p>
    <p class="startClass">CSS [attribute^="value"] Selector</p>
    <p class="classend">CSS [attribute$="value"] Selector</p>
    <p class="amidclass">CSS [attribute*="value"] Selector</p>

</body>

</html>
