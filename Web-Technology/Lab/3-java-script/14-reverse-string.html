<!-- Lab 14: Write a Java script program to take one string input from user and reverse the string. -->
<html>

<head>
    <title>String Reverse</title>

    <script>
        let str=prompt("Enter a string :");
        let reversedStr=str.split("").reverse().join("");
        document.write("Original String : " + str + "<br>");
        document.write("Reversed String : " + reversedStr);
    </script>
</head>

</html>
