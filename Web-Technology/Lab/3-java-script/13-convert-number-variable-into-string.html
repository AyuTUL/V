<!-- Lab 13: Write a java script program to declare variable as number and convert it into string. Check datatype using typeof operator. -->
<html>

<head>
    <title>Convert Number to String</title>

    <script>
        let variable = 970;
        document.write("Value : " + variable + "<br>Type : " + typeof (variable) + "<br>");
        variable=variable.toString();
        document.write("<br>After converting number to string : <br>");
        document.write("Value : " + variable + "<br>Type : " + typeof (variable));
    </script>
</head>

</html>
