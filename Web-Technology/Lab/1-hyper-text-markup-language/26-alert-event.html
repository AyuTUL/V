<!-- Lab 26: Design a webpage using HTML <button> tag and show the alert message when button is clicked. -->
<html>

<head>
    <title>Alert Event</title>
    <style>
        button {
            background-color: #5cb85c;
            color: white;
            padding: 2px 7px;
            border-radius: 5px;
            font-family: Arial, sans-serif;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>

<body>
    <button onclick="alert('Hello! Welcome Event')">Click me</button>
</body>

</html>
