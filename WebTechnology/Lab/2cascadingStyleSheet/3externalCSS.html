<!-- Lab 3: Give an example of external CSS.-->
<html>
<head>
    <title>External CSS</title>

    <style>
        body {
            margin: 0;
            padding: 0;
        }

        h2 {
            text-align: center;
            margin:20px;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 30px;
        }

        video {
            width: 400px;
            height: auto;
        }

        p {
            margin: 0;
        }
    </style>
</head>

<body>
    <h2>Head</h2>

    <div class="container">
        <p>text</p>

        <video controls>
            <source src="">
        </video>

        <p>text</p>
    </div>
</body>
</html>
