<!-- Lab 24: Make small boxes using HTML elements and CSS. And use CSS float property with the value left or right. -->
<html>

<head>
    <title>Float Property</title>

    <style>
        .box {
            border: 1px solid black;
            background-color: lightblue;
            line-height: 100px;
            font-size: 25px;
            width: 100px;
            height: 100px;
            margin: 5px;
            float: left;
        }
    </style>
</head>

<body>
    <div class="box">Box 1
    </div>
    <div class="box">Box 2
    </div>
    <div class="box">Box 3
    </div>
    <div class="box">Box 4
    </div>
</body>

</html>
