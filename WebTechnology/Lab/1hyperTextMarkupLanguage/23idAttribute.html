<!-- Lab 23: Design a webpage using <div> tag using id attribute.-->
<html>

<head>
    <title>Div Tag & Id Attribute</title>

    <style>
        div {
            border: 2px solid black;
            margin: 10px;
            padding: 15px;
            font-family: Arial, sans-serif;
        }

        label {
            display: inline-block;
            min-width: 100px;
            margin: 5px;
        }

        #header {
            text-align: center;
            background-color: lightblue;
        }

        #details {
            background-color: lightgreen;
        }

        #hobbies {
            background-color: lightyellow;
        }

        #footer {
            text-align: center;
            background-color: lightgray;
        }
    </style>
</head>

<body>

    <div id="header">
        <h1>Who Are You?</h1>
    </div>

    <div id="details">
        <h2>1: Personal Details</h2>

        <label>Name :</label>
        <input type="text"><br>

        <label>Age :</label>
        <input type="text"><br>

        <label>Address :</label>
        <input type="text"><br><br>

        <button>Save Details</button>
    </div>

    <div id="hobbies">
        <h2>2: Hobbies</h2>

        <label>Select Hobby:</label>
        <select>
            <option>Reading</option>
            <option>Traveling</option>
            <option>Cooking</option>
            <option>Sports</option>
            <option>Music</option>
        </select>
        <br><br>

        <input type="radio" name="activityType"> Indoor
        <input type="radio" name="activityType"> Outdoor
        <br><br>

        <button>Submit Answer</button>
    </div>

    <div id="footer">
        <h2>Contact Information</h2>
        <p>Email : havoctuladhar7@gmail.com | Phone: +977 9767488322</p>
    </div>

</body>

</html>
